<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Senyap ov-system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style id="page-css">
:root{
  --accent:#6366F1; --accent-ink:#4F46E5;
  --kritis:#EF4444; --sedang:#F59E0B; --rendah:#64748B; --beres:#10B981;
  --ground:#F5F6FB; --surface:#FFFFFF; --surface-2:#EEF0F8;
  --border:#E2E4F0; --border-strong:#CFD3E6;
  --ink:#171A26; --ink-2:#3D4256; --muted:#666B84;
  --shadow:0 1px 2px rgba(23,26,38,.05), 0 8px 24px -16px rgba(23,26,38,.28);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#818CF8; --accent-ink:#A5B0FF;
    --kritis:#F87171; --sedang:#FBBF24; --rendah:#94A3B8; --beres:#34D399;
    --ground:#0D0F17; --surface:#151824; --surface-2:#1C2030;
    --border:#242839; --border-strong:#333850;
    --ink:#E5E7F2; --ink-2:#C2C6DA; --muted:#8B90A8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --accent:#818CF8; --accent-ink:#A5B0FF;
  --kritis:#F87171; --sedang:#FBBF24; --rendah:#94A3B8; --beres:#34D399;
  --ground:#0D0F17; --surface:#151824; --surface-2:#1C2030;
  --border:#242839; --border-strong:#333850;
  --ink:#E5E7F2; --ink-2:#C2C6DA; --muted:#8B90A8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:36px 22px 96px}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.tnum{font-variant-numeric:tabular-nums}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px 32px;
  padding-bottom:22px;border-bottom:2px solid var(--ink)}
.mast h1{margin:0;font-size:clamp(28px,4.2vw,44px);line-height:1.02;
  letter-spacing:-.032em;font-weight:700;text-wrap:balance}
.mast .sub{margin:8px 0 0;color:var(--muted);max-width:62ch;font-size:14.5px}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
.mast-right{margin-left:auto;display:flex;gap:26px;align-items:flex-end}
.bignum{display:flex;flex-direction:column;gap:2px}
.bignum b{font-family:var(--mono);font-size:30px;font-weight:600;
  letter-spacing:-.03em;line-height:1}
.bignum span{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.13em;color:var(--muted)}

.gate{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 4px}
.gate .chip{display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:5px;
  background:var(--surface);border:1px solid var(--border);color:var(--ink-2)}
.gate .chip i{width:5px;height:5px;border-radius:50%;background:var(--beres);
  flex:none;font-style:normal}

/* ---------- rencana sesi ---------- */
.plan{margin-top:30px}
.plan-head{display:flex;align-items:flex-start;gap:14px;width:100%;
  background:none;border:0;padding:0 0 13px;margin:0;cursor:pointer;
  color:inherit;font:inherit;text-align:left}
.plan-head:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.plan-head-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.plan-head-title{font-size:19px;font-weight:650;letter-spacing:-.016em}
.plan-head-sub{color:var(--muted);font-size:13.5px;max-width:74ch;line-height:1.5}
.plan-chev{margin-left:auto;flex:none;width:26px;height:26px;display:grid;
  place-items:center;border:1px solid var(--border);border-radius:6px;
  color:var(--muted);background:var(--surface);transition:transform .18s ease}
.plan-chev svg{width:12px;height:12px}
.plan.open .plan-chev{transform:rotate(180deg)}
.plan-head:hover .plan-chev{border-color:var(--border-strong);color:var(--ink-2)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;
  flex-direction:column;gap:6px}
.plan-list[hidden]{display:none}
.plan-btn{display:grid;grid-template-columns:44px 1fr auto;gap:14px;width:100%;
  text-align:left;align-items:start;padding:12px 14px;cursor:pointer;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  color:inherit;font:inherit;box-shadow:var(--shadow);
  transition:border-color .12s,background .12s}
.plan-btn:hover{border-color:var(--border-strong)}
.plan-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan-btn[aria-pressed="true"]{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.plan-n{font-family:var(--mono);font-size:18px;font-weight:600;
  color:var(--accent-ink);letter-spacing:-.02em;line-height:1.25;
  font-variant-numeric:tabular-nums}
.plan-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.plan-title{font-size:14.5px;font-weight:600;letter-spacing:-.008em}
.plan-why{color:var(--ink-2);font-size:13px;line-height:1.5;max-width:74ch}
.plan-ids{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.plan-ids em{font-family:var(--mono);font-size:10.5px;font-style:normal;
  padding:2px 6px;border-radius:4px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted)}
.plan-ids em.hit{background:color-mix(in srgb,var(--beres) 13%,transparent);
  border-color:color-mix(in srgb,var(--beres) 32%,transparent);
  color:var(--beres);text-decoration:line-through}
.plan-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;
  white-space:nowrap}
.plan-count{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-2)}
.plan-cost{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;padding:2px 6px;border-radius:4px;border:1px solid var(--border)}
.plan-item[data-cost="ringan"] .plan-cost{color:var(--beres);
  border-color:color-mix(in srgb,var(--beres) 32%,transparent)}
.plan-item[data-cost="sedang"] .plan-cost{color:var(--sedang);
  border-color:color-mix(in srgb,var(--sedang) 34%,transparent)}
.plan-item[data-cost="berat"] .plan-cost{color:var(--kritis);
  border-color:color-mix(in srgb,var(--kritis) 34%,transparent)}
.plan-item.cleared .plan-btn{opacity:.55}
.plan-item.cleared .plan-count{color:var(--beres)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  position:sticky;top:0;z-index:20;padding:14px 0 15px;
  background:linear-gradient(var(--ground) 76%,transparent);margin-top:10px}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.f{font-family:var(--mono);font-size:11.5px;font-weight:500;padding:6px 11px;
  border-radius:6px;border:1px solid var(--border);background:var(--surface);
  color:var(--ink-2);cursor:pointer;
  transition:border-color .12s,background .12s,color .12s}
.f:hover{border-color:var(--border-strong)}
.f[aria-pressed="true"]{background:var(--ink);color:var(--ground);
  border-color:var(--ink)}
.f .n{opacity:.55;margin-left:5px}
.f:focus-visible,.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{margin-left:auto;display:flex;align-items:center;gap:11px}
.track{width:140px;height:6px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--border);overflow:hidden}
.track i{display:block;height:100%;background:var(--beres);
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.pct{font-family:var(--mono);font-size:12px;color:var(--muted)}
.save{font-family:var(--mono);font-size:11px;color:var(--muted);
  min-width:70px;text-align:right}

.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:2px}
.sec-key{font-family:var(--mono);font-size:12px;font-weight:600;
  color:var(--accent-ink);letter-spacing:.06em}
.sec-head h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.016em}
.sec-count{margin-left:auto;font-family:var(--mono);font-size:11px;
  color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.sec-note{margin:0 0 12px;color:var(--muted);font-size:13.5px;max-width:70ch}

.rows{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:3px 46px 1fr;
  background:var(--surface);border:1px solid var(--border);
  border-radius:9px;overflow:hidden;box-shadow:var(--shadow);
  transition:border-color .12s,opacity .12s}
.row:hover{border-color:var(--border-strong)}
.row .stripe{background:var(--sev)}
.row .gutter{display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:13px 0 12px;border-right:1px solid var(--border);
  background:var(--surface-2)}
.row .id{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--sev)}
.row .ses{font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.05em;color:var(--muted);padding:1px 4px;border-radius:3px;
  border:1px solid var(--border)}
.tick{width:17px;height:17px;border-radius:4px;
  border:1.5px solid var(--border-strong);background:var(--surface);
  cursor:pointer;display:grid;place-items:center;padding:0;
  transition:background .12s,border-color .12s}
.tick svg{width:11px;height:11px;stroke:var(--surface);stroke-width:3;
  fill:none;opacity:0;transition:opacity .12s}
.tick[aria-checked="true"]{background:var(--beres);border-color:var(--beres)}
.tick[aria-checked="true"] svg{opacity:1}
.body{padding:11px 15px 12px;min-width:0}
.row h3{margin:0;font-size:14.5px;font-weight:600;letter-spacing:-.008em;
  line-height:1.4;text-wrap:balance}
.row p{margin:5px 0 0;color:var(--ink-2);font-size:13.5px;line-height:1.5;
  max-width:78ch}
.refs{display:flex;flex-wrap:wrap;gap:4px 5px;margin-top:9px}
.ref{font-family:var(--mono);font-size:11px;padding:2.5px 7px;border-radius:4px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
  overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;font-family:var(--mono);
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  padding:2.5px 7px;border-radius:4px;margin-left:8px;vertical-align:2px;
  background:color-mix(in srgb,var(--beres) 14%,transparent);color:var(--beres);
  border:1px solid color-mix(in srgb,var(--beres) 35%,transparent)}
.row.done{opacity:.6}
.row.done h3{text-decoration:line-through;text-decoration-thickness:1px;
  text-decoration-color:var(--muted)}
.row.done:hover{opacity:.88}
.empty{color:var(--muted);font-size:13.5px;padding:10px 0}

.foot{margin-top:52px;padding-top:20px;border-top:1px solid var(--border);
  color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;
  gap:8px 22px;align-items:baseline}
.foot .mono{font-size:11.5px}

@media (max-width:640px){
  .wrap{padding:26px 14px 72px}
  .mast-right{margin-left:0;width:100%;gap:20px}
  .row{grid-template-columns:3px 40px 1fr}
  .progress{margin-left:0;width:100%}
  .track{flex:1;width:auto}
  .plan-btn{grid-template-columns:34px 1fr;gap:10px}
  .plan-meta{grid-column:2;flex-direction:row;align-items:center;gap:8px;
    justify-content:flex-start;margin-top:2px}
  /* Ten sessions of full reasoning pushed the checklist itself roughly two
     screens down. The ids, the count and the cost are the parts you act on;
     the argument is still there, just clamped until there is room for it. */
  .plan-why{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    if (filter.charAt(0) === "s") return SESSION_OF[f.id] === Number(filter.slice(1));
    return f.s === filter;
  }

          '<svg viewBox="0 0 12 12" aria-hidden="true">' +

          return '<span class="ref">' + esc(x) + '</span>';
        }).join("") + '</div>' +
      '</div></article>';
  }

  function sectionsHTML() {
    return SECTIONS.map(function (sec) {
      var all = F.filter(function (f) { return f.id.charAt(0) === sec.key; });

      return '<section class="sec">' +
        '<div class="sec-head"><span class="sec-key">' + sec.key + '</span>' +

      '<main id="list">' + sectionsHTML() + '</main>' +
      '<footer class="foot">' +
        '<span>Audit terhadap <span class="mono">ov-system</span> pada commit ' +
        '<span class="mono">9f5f5be</span>.</span>' +
        '<span>Sesi 0 sampai 1 selesai: <span class="mono">v1.38.1</span>, ' +
        '<span class="mono">v1.38.2</span>, <span class="mono">v1.38.3</span>.</span>' +
      '</footer></div>';
  }

  function paint() {
    document.getElementById("root").innerHTML = shellHTML();
  }

  // ---------- persistence ----------
  var ns = null, timer = null;

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (n) { ns = n; })
      .catch(function () { ns = null; });
  }

  function renderDocument() {
    var css = document.getElementById("page-css").textContent;
    var app = document.getElementById("page-app").textContent;
    var close = "<" + "/script>";
    var saved = saveNote;
    saveNote = "";
    var shell = shellHTML();
    saveNote = saved;
    return '<!doctype html>\n<html lang="id">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>Audit Senyap ov-system</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?' +
      'family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">\n' +
      '<style id="page-css">' + css + '</style>\n</head>\n<body>\n' +
      '<div id="root">' + shell + '</div>\n' +
      '<script id="page-state" type="application/json">' +
      JSON.stringify({ done: Array.from(done) }) + close + '\n' +
      '<script id="page-app">' + app + close + '\n</body>\n</html>';
  }

  function note(text) { saveNote = text; paint(); }

  function scheduleSave() {
    stateEl.textContent = JSON.stringify({ done: Array.from(done) });
    if (!ns) return;
    note("menyimpan");
    clearTimeout(timer);
    timer = setTimeout(function () {
      ns.publish(renderDocument()).then(function () {
        note("tersimpan");
      }).catch(function (err) {
        var code = err && err.code;
        if (code === "conflict") { note(""); return; }
        if (code === "not_writer" || code === "not_granted" ||
            code === "not_declared" || code === "capability_disabled" ||
            code === "consent_required") {
          ns = null;
          note("hanya baca");
          return;
        }
        note("gagal simpan");
      });
    }, 1500);
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("#plan-toggle")) {
      planOpen = !planOpen;
      paint();
      return;
    }
    var tick = e.target.closest && e.target.closest(".tick");
    if (tick) {
      var id = tick.closest(".row").getAttribute("data-id");
      if (done.has(id)) done.delete(id); else done.add(id);
      saveNote = "";
      paint();
      scheduleSave();
      return;
    }
    var f = e.target.closest && e.target.closest("[data-f]");
    if (f) {
      var next = f.getAttribute("data-f");
      // Clicking the session you are already filtered to clears the filter,
      // so the roadmap doubles as its own way back out.
      filter = filter === next ? "semua" : next;
      paint();
      if (filter.charAt(0) === "s") {
        var list = document.getElementById("list");
        if (list) list.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }
  });

  paint();
})();
</script>

</body></html>
